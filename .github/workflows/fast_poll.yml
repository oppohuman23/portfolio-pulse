name: fast-poll

# Filings + news + Telegram command drain.
# ~08:00–24:00 IST is 02:30–18:30 UTC. '*/10 2-18' covers it with a small margin.
# NOTE (free-tier minutes): every 10 min for ~17h ≈ 100 runs/day. On a PRIVATE
# repo that can exceed the 2,000 free minutes/month — use a PUBLIC repo (Actions
# minutes are unlimited there; all secrets stay in GitHub Secrets, never in code),
# or widen the interval to '*/15'. See README "Hosting".
on:
  # The cron-job.org pinger (workflow_dispatch) is the single on-time driver.
  # A GitHub schedule at the same minutes used to double-fire into the one
  # concurrency group every cycle, cancelling one of the pair — those were the
  # phantom "failed" runs. A sparse hourly fallback stays, off the pinger's
  # :04/:14/... minutes so it can't collide, in case the pinger ever dies.
  workflow_dispatch:
  schedule:
    - cron: "37 2-18 * * *"

concurrency:
  group: pulse-fast-poll
  # Newest poll wins — a stuck/queued run never blocks a fresh one. Safe because
  # items are marked seen only after delivery, so a cancelled mid-run poll loses
  # nothing (its undelivered items reappear next tick).
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run heartbeat (poll + due daily jobs)
        env:
          PP_STORE_BACKEND: supabase
          PP_DASHBOARD_URL: ${{ vars.PP_DASHBOARD_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
        run: python -m portfolio_pulse.jobs.heartbeat
